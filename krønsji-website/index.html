<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap"
      rel="stylesheet" />
    <link rel="icon" href="./Assets/images/logo-krønsji.png" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet" />
    <title>Krønsji - Fried Chicken</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <a href="/">
          <img
            src="./Assets/images/logo-krønsji.png"
            alt="Krønsji Logo"
            class="logo-img"
          />
        </a>        
        <h1 class="name">Krønsji</h1>
      </div>
      <nav class="nav">
        <a href="#menu">Meny</a>
        <a href="contact.html">Kontakt</a>
      </nav>
    </header>

    <div class="container">
      <aside class="sidebar">
        <h3>Ring og bestill</h3>
        <p><i class="bx bxs-phone"></i>70 06 64 32</p>
        <h3>Åpningstider</h3>
        <p>Man - Fre: 14:00 - 22:00</p>
        <p>Lør: 14:00 - 03:00</p>
        <p>Søn: 14:00 - 22:00</p>
        <h3>Addresse:</h3>
        <p>Ivar Aasen-gata 4, 6155 Ørsta</p>
        <h3>Sosiale medier</h3>
        <a href="#"
          ><img
            class="instagramLogo"
            src="./Assets/images/instragram.png"
            alt="Instagram"
        /></a>
        <a
          href="https://www.facebook.com/profile.php?id=61574177161342"
          target="_blank"
          ><img
            class="facebookLogo"
            src="./Assets/images/facebook.png"
            alt="Facebook"
        /></a>
        <h3>Allergier</h3>
        <p>Finn allergener info på meny</p>
        <h4>&copy; 2025 Krønsji. Alle rettigheter reservert.</h4>
      </aside>

      <main class="menu-container" id="menu">
        <div class="button-filter-container">
          <button class="button-filter button-active" id="buttonAlle">
            Hele menyen
          </button>
          <button class="button-filter" id="buttonBurger">
            Krønsji Burger
          </button>
          <button class="button-filter" id="buttonWraps">Krønsji Wraps</button>
          <button class="button-filter" id="buttonCroissant">Croissants</button>
          <button class="button-filter" id="buttonBaguette">
            Krønsji Strip Baguette
          </button>
          <button class="button-filter" id="buttonFalafel">Falafel</button>
          <button class="button-filter" id="buttonWings">Wings & Strips</button>
          <button class="button-filter" id="buttonCombo">
            Combo & Snack Boxes
          </button>
          <button class="button-filter" id="buttonMenu">Meny</button>
          <button class="button-filter" id="buttonPizza">Pizza</button>
          <button class="button-filter" id="buttonSides">Sides</button>
          <button class="button-filter" id="buttonDrikke">Drikke</button>
        </div>
        <h2 id="menu-name">Hele Menyen</h2>
        <div class="menu-items"></div>
      </main>
    </div>

    <button id="toTop">⬆ Til Toppen</button>
  </body>
</html>
