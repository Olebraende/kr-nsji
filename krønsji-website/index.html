<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap"
      rel="stylesheet" />
    <link rel="icon" href="./Assets/images/logo-krønsji.png" />
    <title>Krønsji - Fried Chicken</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <script src="./js/script.js" defer></script>
    <script src="jquery.js" defer></script>
    <script src="jquery.translate.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <img
          src="./Assets/images/logo-krønsji.png"
          alt="Krønsji Logo"
          class="logo-img" />
        <h1 class="name">Krønsji</h1>
      </div>
      <nav class="nav">
        <a href="#menu">Meny</a>
        <!-- <a href="#about">Om oss</a> -->
        <a href="#contact">Kontakt oss</a>
      </nav>
    </header>

    <div class="container">
      <aside class="sidebar">
        <h3>Ring og bestill</h3>
        <p>+47 123 45 678</p>
        <h3>Åpningstider</h3>
        <p>Man - Fre: 10:00 - 22:00</p>
        <p>Lør - Søn: 12:00 - 23:00</p>
        <h3>Addresse:</h3>
        <p>Storgata 15, 0155 Oslo</p>
        <h3>Telefon:</h3>
        <p>+47 123 45 678</p>
        <h3>Sosiale medier</h3>
        <a href="#"
          ><img
            class="instagramLogo"
            src="./Assets/images/instragram.png"
            alt="Instagram"
        /></a>
        <a href="#"
          ><img
            class="facebookLogo"
            src="./Assets/images/facebook.png"
            alt="Facebook"
        /></a>
        <h3>Allergier</h3>
        <p>Finn allergener info</p>
      </aside>

      <main class="menu-container" id="menu">
        <div class="button-filter-container">
          <button class="button-filter button-active" id="buttonAlle">
            Alle
          </button>
          <button class="button-filter" id="buttonBurger">
            Krønsji Burger
          </button>
          <button class="button-filter" id="buttonWraps">Krønsji Wraps</button>
          <button class="button-filter" id="buttonCroissant">Croissants</button>
          <button class="button-filter" id="buttonBaguette">
            Krønsji Strip Baguette
          </button>
          <button class="button-filter" id="buttonWings">Wings & Strips</button>
          <button class="button-filter" id="buttonCombo">
            Combo/Sharing Boxes
          </button>
          <button class="button-filter" id="buttonSides">Sides</button>
          <button class="button-filter" id="buttonDrikke">Drikke</button>
        </div>
        <h2>Meny</h2>
        <div class="menu-items"></div>
      </main>
    </div>

    <button id="toTop">⬆ Til Toppen</button>
  </body>
</html>
