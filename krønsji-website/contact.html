<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.css" />
    <script src="./js/contact.js" defer></script>
    <title>Kontakt oss - Krønsji</title>
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <img
          src="./Assets/images/logo-krønsji.png"
          alt="Krønsji Logo"
          class="logo-img" />
        <h1 class="name">Krønsji</h1>
      </div>
      <nav class="nav">
        <a href="index.html">Meny</a>
        <a href="contact.html">Kontakt oss</a>
      </nav>
    </header>

    <div class="container">
        <aside class="sidebar">
          <h3>Ring og bestill</h3>
          <p>+47 123 45 678</p>
          <h3>Åpningstider</h3>
          <p>Man - Fre: 10:00 - 22:00</p>
          <p>Lør - Søn: 12:00 - 23:00</p>
          <h3>Addresse:</h3>
          <p>Storgata 15, 0155 Oslo</p>
          <h3>Telefon:</h3>
          <p>+47 123 45 678</p>
          <h3>Sosiale medier</h3>
          <a href="#"
            ><img
              class="instagramLogo"
              src="./Assets/images/instragram.png"
              alt="Instagram"
          /></a>
          <a href="#"
            ><img
              class="facebookLogo"
              src="./Assets/images/facebook.png"
              alt="Facebook"
          /></a>
          <p>&copy; 2025 Krønsji. Alle rettigheter reservert.</p>
        </aside>

    <main class="contact-container">
      <h2>Kontakt oss</h2>
      <form id="contactForm" action="https://formspree.io/f/xovevlgy" method="POST">
        <label for="name">Navn:</label>
        <input type="text" id="name" name="name" required>
      
        <label for="email">E-post:</label>
        <input type="email" id="email" name="email" required>
      
        <label for="message">Melding:</label>
        <textarea id="message" name="message" required></textarea>
      
        <button type="submit">Send</button>
      </form>
      
      <p id="statusMessage"></p>

      <script>
        const form = document.getElementById("contactForm");
      
        form.addEventListener("submit", function(event) {
          document.getElementById("statusMessage").innerText = "Takk! E-posten din ble sendt.";
        });
      </script>
      
    </main>
  </body>
</html>
