<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap"
      rel="stylesheet" />
    <link rel="icon" href="./Assets/images/logo-krønsji.png" />
    <title>Krønsji - Fried Chicken</title>
    <link rel="stylesheet" href="./css/styles3.css" />
    <script src="./js/script.js" defer></script>
    <script src="./js/language.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <img
          src="./Assets/images/logo-krønsji.png"
          alt="Krønsji Logo"
          class="logo-img" />
        <h1>Krønsji</h1>
      </div>
      <nav class="nav">
        <a href="#menu" data-translate="menu">Meny</a>
        <!-- <a href="#about" data-translate="about">Om oss</a> -->
        <a href="#contact" data-translate="contact">Kontakt oss</a>
        <!-- <select id="languageSelector">
          <option value="no">Norsk</option>
          <option value="en">English</option>
        </select> -->
      </nav>
    </header>

    <div class="container">
      <aside class="sidebar">
        <h3 data-translate="openingHours">Åpningstider</h3>
        <p>Man - Fre: 10:00 - 22:00</p>
        <p>Lør - Søn: 12:00 - 23:00</p>
        <h3 data-translate="address">Addresse:</h3>
        <p>Storgata 15, 0155 Oslo</p>
        <h3 data-translate="phone">Telefon:</h3>
        <p>+47 123 45 678</p>
        <h3 data-translate="socialMedia">Sosiale medier</h3>
        <a href="#"><img src="instagram.png" alt="Instagram" /></a>
        <a href="#"><img src="facebook.png" alt="Facebook" /></a>
      </aside>

      <main class="menu-container" id="menu">
        <h2>Meny</h2>
        <div class="menu-items"></div>
      </main>
    </div>

    <button id="toTop" data-translate="toTop">⬆ Til Toppen</button>
  </body>
</html>
